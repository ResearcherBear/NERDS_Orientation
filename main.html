<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catch Them All!</title>
<link rel="stylesheet" href="main.css" />
</head>
<body>

<div class="screen">

  <div class="title-box">
    <h1>Catch Them All!</h1>
  </div>

  <div class="action-row">
    <button type="button" class="action-btn" id="scanBtn">SCAN</button>
    <button type="button" class="action-btn" id="mapBtn">MAP</button>
  </div>

  <div class="panel">
    <p class="panel-heading">Select And Type The Unique Code</p>

    <div class="card-grid">

      <button type="button" class="card clickable" id="SuCard">
        <div class="card-icon"> 
           <img src="robota.png" alt="Description of the animation"> </div>
        <div class="card-info">
          <p class="card-name">Su</p>
          <p class="card-id">.125</p>
          <p class="card-hp">HP: 110/ 110</p>
          <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
        </div>
      </button>

      <button type="button" class="card clickable" id="JigCard">
        <div class="card-icon"> 
           <img src="robotb.png" alt="Description of the animation"> </div>
        <div class="card-info">
          <p class="card-name">Jig</p>
          <p class="card-id">.125</p>
          <p class="card-hp">HP: 110/ 110</p>
          <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
        </div>
      </button>

      <button type="button" class="card clickable" id="figureCard">
        <div class="card-icon"> 
           <img src="robotc.jpg" alt="Description of the animation"> </div>
        <div class="card-info">
          <p class="card-name">Figure</p>
          <p class="card-id">.125</p>
          <p class="card-hp">HP: 110/ 110</p>
          <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
        </div>
      </button>

      <button type="button" class="card clickable" id="AptitudeCard">
        <div class="card-icon"> 
           <img src="robotd.jpg" alt="Description of the animation"> </div>
        <div class="card-info">
          <p class="card-name">Aptitude</p>
          <p class="card-id">.125</p>
          <p class="card-hp">HP: 110/ 110</p>
          <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
        </div>
      </button>

      <button type="button" class="card clickable" id="MoveCard">
        <div class="card-icon"> 
           <img src="robote.jpg" alt="Description of the animation"> </div>
        <div class="card-info">
          <p class="card-name">Move</p>
          <p class="card-id">.125</p>
          <p class="card-hp">HP: 110/ 110</p>
          <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
        </div>
      </button>
      <button type="button" class="card clickable" id="typingCard">
        <div class="card-icon"> 
           <img src="robotf.jpg" alt="Description of the animation"> </div>
        <div class="card-info">
          <p class="card-name">Typing</p>
          <p class="card-id">.125</p>
          <p class="card-hp">HP: 110/ 110</p>
          <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
        </div>
      </button>

    </div>
  </div>

  <div class="pikachu-slot" id="pikachuSlot">
    <img src="nerdsfull.gif" alt="Description of the animation">
  </div>

</div>

<script type="module" src="main.js"></script>
</body>
</html>
