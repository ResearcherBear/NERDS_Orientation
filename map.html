<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map</title>
<link rel="stylesheet" href="map.css" />
</head>
<body>

<div class="screen">

  <div class="title-box">
    <h1>Catch Them All!</h1>
  </div>

  <div class="action-row">
    <button type="button" class="action-btn" id="scanBtn">SCAN</button>
    <button type="button" class="action-btn active" id="mapBtn">MAP</button>
  </div>

  <div class="panel">
    <div class="map-box" id="mapBox">
      <p class="map-hint">Map view coming soon</p>
    </div>

    <p class="panel-heading">Find Nearby Activities</p>

    <div class="nav-row">
      <button type="button" class="nav-btn" id="backBtn">BACK</button>
    </div>
  </div>

  <!-- Pikachu gif goes here -->
  <div class="pikachu-final" id="pikachuFinal">
    
  </div>

</div>

<script type="module" src="map.js"></script>
</body>
</html>
